[package]
name = "edit"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
magnolia-applet = { path = "../../../../sdk/rust/magnolia-applet", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = "symbols"
debug = 0
incremental = false
